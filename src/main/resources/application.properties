spring.application.name=proyecto-uni


# configuración de la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyectounidb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


# OpenAI configuration
openai.api.key=${OPENAI_API_KEY}


# PASO 2 PARA TWILIO
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.phone.number=${TWILIO_PHONE_NUMBER}

# WhatsApp Sandbox (diferente al SMS)
twilio.whatsapp.number=${TWILIO_WHATSAPP_NUMBER:+14155238886}


# Modo desarrollo - cambiar a false para producción
app.sms.enabled=${APP_SMS_ENABLED:true}
